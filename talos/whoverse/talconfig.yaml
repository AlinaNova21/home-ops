---
clusterName: whoverse
talosVersion: v1.13.5
kubernetesVersion: v1.36.2
endpoint: https://192.168.2.20:6443

# Allow workloads on control plane nodes
allowSchedulingOnControlPlanes: true

# Cluster networking
clusterPodNets:
  - 10.244.0.0/16
clusterSvcNets:
  - 10.96.0.0/12

# CNI configuration - disable default for Cilium
cniConfig:
  name: none

nodes:
  - hostname: whoverse-cp1  # ZimaBoard
    ipAddress: 192.168.2.21
    controlPlane: true
    installDisk: /dev/sda
    patches:
      - "@./ceph-osd-volume.yaml"
      - "@./miroir-disk.yaml"
      - "@./patches/networking/common.yaml"
      - "@./patches/networking/zimaboard.yaml"

  - hostname: whoverse-cp2  # ZimaBoard
    ipAddress: 192.168.2.22
    controlPlane: true
    installDisk: /dev/sda
    patches:
      - "@./ceph-osd-volume.yaml"
      - "@./miroir-disk.yaml"
      - "@./patches/networking/common.yaml"
      - "@./patches/networking/zimaboard.yaml"

  - hostname: whoverse-cp3  # ZimaBoard
    ipAddress: 192.168.2.23
    controlPlane: true
    installDisk: /dev/sda
    patches:
      - "@./ceph-osd-volume.yaml"
      - "@./miroir-disk.yaml"
      - "@./patches/networking/common.yaml"
      - "@./patches/networking/zimaboard.yaml"

  - hostname: whoverse-w1  # ZimaBoard 2
    ipAddress: 192.168.2.24
    controlPlane: false
    installDisk: /dev/disk/by-id/wwn-0x5001b444a9bb4808
    patches:
      - "@./ceph-osd-volume.yaml"
      - "@./miroir-disk.yaml"
      - "@./patches/networking/common.yaml"
      - "@./patches/networking/zimaboard2.yaml"

  - hostname: whoverse-w2  # VM (libvirt)
    ipAddress: 192.168.2.225
    controlPlane: false
    installDisk: /dev/sda
    patches:
      - "@./miroir-disk-w2.yaml"
      - "@./patches/networking/common.yaml"
      - "@./patches/networking/vm.yaml"
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/iscsi-tools
            - siderolabs/realtek-firmware
            - siderolabs/gvisor
            - siderolabs/qemu-guest-agent
            - siderolabs/amdgpu
            - siderolabs/i915
            - siderolabs/xe
            - siderolabs/drbd

controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/iscsi-tools
          - siderolabs/realtek-firmware
          - siderolabs/gvisor
          - siderolabs/amdgpu
          - siderolabs/i915
          - siderolabs/xe
          - siderolabs/drbd
  patches:
    - |-
      cluster:
        proxy:
          disabled: true
    - |-
      cluster:
        apiServer:
          extraArgs:
            oidc-issuer-url: https://dex.whoverse.dev
            oidc-client-id: kubernetes
            oidc-username-claim: email
            oidc-groups-claim: groups
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:admin
            allowedKubernetesNamespaces:
              - system-upgrade
    - "@./patches/spegel-containerd-config.yaml"
    - "@./patches/watchdog.yaml"
    - "@./patches/kernel-miroir.yaml"
    - "@./patches/kubelet-miroir.yaml"
    # Bind control-plane component metrics ports (10257/10259) to all
    # interfaces. Talos defaults to 127.0.0.1 (loopback only), so vmagent
    # gets connection-refused scraping https://<node-ip>:10257/:10259.
    # Ports stay TLS + token-authenticated + SAR-authorized.
    - |-
      cluster:
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0
            # Force-delete terminal pods (Failed/Succeeded) once the
            # cluster-wide count exceeds this; default is 12500 (= never).
            terminated-pod-gc-threshold: "100"
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0
  # Limit ephemeral volume size
  volumes: &sharedVolumes
    - name: EPHEMERAL
      provisioning:
        diskSelector:
          match: system_disk
        maxSize: 64GiB
  # hostpath user volume removed as part of the miroir migration. Each
  # pool node now gets a per-node miroir-disk.yaml patch (see nodes[].patches)
  # which creates an r-miroir RawVolumeConfig consumed by the home-operations/miroir
  # CSI driver as its LVM-thin backing device. The user-volume approach is
  # retired once every pool node is on mirror storage.

worker:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/iscsi-tools
          - siderolabs/realtek-firmware
          - siderolabs/gvisor
          - siderolabs/amdgpu
          - siderolabs/i915
          - siderolabs/xe
          - siderolabs/drbd
  patches:
    - |-
      cluster:
        proxy:
          disabled: true
    - "@./patches/spegel-containerd-config.yaml"
    - "@./patches/watchdog.yaml"
    - "@./patches/kernel-miroir.yaml"
    - "@./patches/kubelet-miroir.yaml"
  volumes: *sharedVolumes
  nodeLabels:
    miroir.home-operations.com/enabled: "true"
