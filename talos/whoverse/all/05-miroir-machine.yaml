machine:
  kernel:
    modules:
      - name: drbd
        parameters:
          - usermode_helper=disabled
      - name: drbd_transport_tcp
      - name: dm_thin_pool
  sysctls:
    user.max_user_namespaces: "11255"
  kubelet:
    extraConfig:
      shutdownGracePeriod: 120s
      shutdownGracePeriodCriticalPods: 60s
  nodeLabels:
    miroir.home-operations.com/enabled: "true"
