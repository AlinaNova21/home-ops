apiVersion: v1alpha1
kind: BridgeConfig
name: br0
links:
  - bond0
stp:
  enabled: true
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: br0
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - enp2s0
  - enp3s0
bondMode: 802.3ad
miimon: 100
updelay: 100
downdelay: 100
xmitHashPolicy: layer3+4
lacpRate: fast
up: true
