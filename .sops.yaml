creation_rules:
  # Kubernetes Secrets/files (Flux bootstrap + flux-config secret):
  # encrypt only the Secret values (.data/.stringData); apiVersion/kind/
  # metadata/type stay plaintext. Recipients: personal age + Flux age + GPG
  # (union of the keysets the two k8s secrets use).
  - path_regex: kubernetes/.*\.sops\.yaml$
    encrypted_regex: "^(data|stringData)$"
    age: >-
      age16865gej0ndnlnghdq347fur59ht8d7wrcfptdw5ja4fhc4lwdfpq59ratl,
      age1maj5j0km9m39u7l2fxy5dyvuah79ewfvqa0wq69wdxsd6dqdtcaqe0e6dq
    pgp: >-
      B2266723EDB691FBB16501BC07D6E31CCAE33514

  # Talos secrets - a talsecret is a flat k/v tree (cluster/secrets/certs),
  # NOT a k8s Secret, so encrypt the whole file. Personal age + GPG.
  - path_regex: talos/.*\.yaml$
    age: >-
      age16865gej0ndnlnghdq347fur59ht8d7wrcfptdw5ja4fhc4lwdfpq59ratl
    pgp: >-
      B2266723EDB691FBB16501BC07D6E31CCAE33514
