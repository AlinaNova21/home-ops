---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr
  namespace: system-upgrade
spec:
  interval: 30m
  path: "./kubernetes/system-upgrade/tuppr/app"
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: tuppr
      namespace: system-upgrade
  timeout: 10m
  wait: true
  prune: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr-config
  namespace: system-upgrade
spec:
  dependsOn:
    - name: tuppr
  interval: 30m
  path: "./kubernetes/system-upgrade/tuppr/config"
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
  prune: true
  timeout: 5m
