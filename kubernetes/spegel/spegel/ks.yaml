---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spegel
  namespace: spegel
spec:
  interval: 15m
  path: "./spegel/spegel/app"
  sourceRef:
    kind: OCIRepository
    name: home-ops
    namespace: flux-system
  wait: true
  prune: true
