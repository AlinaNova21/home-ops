---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kopiur-mirror
  namespace: kopiur-system
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete", "deletecollection"]
