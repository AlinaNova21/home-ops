---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: whoverse
spec:
  credentialProjection:
    allowed: true
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: k8s-cluster-backup
      prefix: kopiur/
      endpoint: 192.168.2.193:30188
      region: garage
      tls:
        disableTls: true
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  server:
    namespace: kopiur-system
    readOnly: true
    auth:
      generate: {}
    service:
      type: ClusterIP
      port: 51515
