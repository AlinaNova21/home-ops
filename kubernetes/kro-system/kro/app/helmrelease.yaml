---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kro
  namespace: kro-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kro
    namespace: kro-system
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    rbac:
      mode: aggregation
    config:
      enableLeaderElection: true
      logLevel: info
    metrics:
      service:
        create: true
        type: ClusterIP
        port: 8078
      serviceMonitor:
        enabled: true
