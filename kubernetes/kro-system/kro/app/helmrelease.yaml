---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kro
  namespace: kro-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kro
      version: 0.9.2
      sourceRef:
        kind: HelmRepository
        name: kro
        namespace: flux-system
      interval: 24h
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    rbac:
      mode: aggregation
    config:
      enableLeaderElection: true
      logLevel: info
    metrics:
      service:
        create: true
        type: ClusterIP
        port: 8078
      serviceMonitor:
        enabled: false
