---
# RGD that exposes a `Backup` custom API. Replaces the
# `kubernetes/components/kopiur/backup/` kustomize component (and
# `components/kopiur/seafile-backup/` for multi-PVC apps).
#
# Convention: the kro instance `metadata.name` equals the app's
# Flux-substituted `${APP}`. The rendered SnapshotPolicy + SnapshotSchedule
# take that name; the rendered Restore is named per-PVC (so the app's PVC
# `dataSourceRef.name` keeps matching — `${APP}` for single-PVC apps, the
# full PVC name for multi-PVC apps).
#
# The RGD owns the snapshot feature surface that the legacy components
# carried via raw YAML: copy method, volume snapshot class, optional
# staging storage class, the per-PVC owner (uid/gid/fsGroup) on both the
# policy and the restore mover, and the optional snapshot identity
# override used by apps like ntfy.
#
# fsGroup is optional in the schema; the resource templates fall back to
# gid when fsGroup is unset (via ${schema.spec.?fsGroup.orValue(schema.spec.gid)}),
# so a Backup author who sets only uid + gid still produces a valid render.
#
# The staging and identity blocks are always emitted; the Kopiur CRD
# marks both as nullable, so an unset stagingStorageClassName or identity
# field renders as `null` and is accepted by the CRD.
#
# Defaults match the cluster's mirror stack: copyMethod=Snapshot,
# volumeSnapshotClassName=miroir-snap, stagingStorageClassName=miroir-local,
# uid/gid=1000. Outliers (jellyfin=0/0, seafile=999/999) override uid/gid;
# fsGroup inherits gid via the optional-orValue fallback above.
#
# Migration of existing apps is intentionally out of scope for this PR; the
# RGD is staged here so it's available the day an app author wants to adopt it.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: backup
spec:
  schema:
    apiVersion: v1alpha1
    kind: Backup

    spec:
      pvcNames: "[]string | required=true minItems=1 maxItems=20"
      repository: string | default="whoverse"
      credentialProjection: boolean | default=true
      schedule: string | default="H * * * *"
      retention:
        keepDaily: integer | default=7
        keepWeekly: integer | default=4
        keepMonthly: integer | default=3
      copyMethod: string | default="Snapshot"
      volumeSnapshotClassName: string | default="miroir-snap"
      stagingStorageClassName: string | default="miroir-local"
      uid: integer | default=1000
      gid: integer | default=1000
      fsGroup: "integer | required=false"
      identity:
        username: "string | required=false"
        hostname: "string | required=false"

    status:
      ready: ${policy.status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')}
      activeSnapshotCount: ${policy.status.retention.activeSnapshotCount}
      lastSnapshotTime: ${string(policy.status.lastSuccessfulSnapshot)}
      restoreReady: ${restore.all(r, r.status.phase == 'Completed')}

  resources:
    - id: policy
      template:
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: ${schema.metadata.name}
        spec:
          repository:
            kind: ClusterRepository
            name: ${schema.spec.repository}
          copyMethod: ${schema.spec.copyMethod}
          volumeSnapshotClassName: ${schema.spec.volumeSnapshotClassName}
          staging:
            storageClassName: ${schema.spec.stagingStorageClassName}
          mover:
            securityContext:
              runAsUser: ${schema.spec.uid}
              runAsGroup: ${schema.spec.gid}
            podSecurityContext:
              fsGroup: ${schema.spec.?fsGroup.orValue(schema.spec.gid)}
          credentialProjection:
            enabled: ${schema.spec.credentialProjection}
          sources: '${schema.spec.pvcNames.map(n, {"pvc": {"name": n}, "sourcePathStrategy": "PvcName"})}'
          retention:
            keepDaily: ${schema.spec.retention.keepDaily}
            keepWeekly: ${schema.spec.retention.keepWeekly}
            keepMonthly: ${schema.spec.retention.keepMonthly}
          identity:
            username: ${schema.spec.identity.username}
            hostname: ${schema.spec.identity.hostname}

    - id: schedule
      template:
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotSchedule
        metadata:
          name: ${schema.metadata.name}
        spec:
          policyRef:
            name: ${schema.metadata.name}
          schedule:
            cron: ${schema.spec.schedule}

    - id: restore
      forEach:
        - pvc: ${schema.spec.pvcNames}
      template:
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: Restore
        metadata:
          name: ${pvc}
        spec:
          source:
            fromPolicy:
              name: ${schema.metadata.name}
              offset: 0
          policy:
            onMissingSnapshot: Continue
          target:
            populator: {}
          credentialProjection:
            enabled: ${schema.spec.credentialProjection}
          mover:
            securityContext:
              runAsUser: ${schema.spec.uid}
              runAsGroup: ${schema.spec.gid}
            podSecurityContext:
              fsGroup: ${schema.spec.?fsGroup.orValue(schema.spec.gid)}
