---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator
  namespace: network
spec:
  interval: 30m
  path: "./kubernetes/network/tailscale/app"
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
  timeout: 10m
  wait: true
  prune: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-operator-config
  namespace: network
spec:
  interval: 10m
  path: "./kubernetes/network/tailscale/config"
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
  dependsOn:
    - name: tailscale-operator
  timeout: 5m
  wait: true
  prune: true
