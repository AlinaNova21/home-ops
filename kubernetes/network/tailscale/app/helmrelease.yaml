---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: network
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tailscale-operator
    namespace: network
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    oauthSecretVolume:
      secret:
        secretName: tailscale-operator-oauth
    operator:
      resources:
        requests:
          memory: 64Mi
