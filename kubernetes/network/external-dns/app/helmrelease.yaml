---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# External DNS for .nexus domain (Cloudflare proxied via tunnel)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-nexus
  namespace: network
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: external-dns-nexus
    namespace: network
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    fullnameOverride: external-dns-nexus
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    extraArgs:
      - --cloudflare-proxied
      - --cloudflare-dns-records-per-page=5000
    sources:
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - gateway-tcproute
      - gateway-udproute
    domainFilters:
      - whoverse.nexus
    policy: sync
    txtOwnerId: whoverse-k8s
    txtPrefix: k8s.
    resources:
      requests:
        memory: 64Mi
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
# External DNS for .dev domain (DNS-only, internal LAN)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-dev
  namespace: network
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: external-dns-dev
    namespace: network
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    fullnameOverride: external-dns-dev
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    extraArgs:
      - --cloudflare-dns-records-per-page=5000
    sources:
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
      - gateway-tcproute
      - gateway-udproute
      - service
    domainFilters:
      - whoverse.dev
    policy: sync
    txtOwnerId: whoverse-k8s
    txtPrefix: k8s.
    resources:
      requests:
        memory: 64Mi
