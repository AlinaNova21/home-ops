---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# External Gateway - accessed via Cloudflare Tunnel
# TLS terminated at origin using Let's Encrypt wildcard certs (DNS01 issued by
# cert-manager from the cluster-issuer annotation, auto-created per listener).
# Uses ClusterIP since it's only accessed by cloudflared internally.
# Multiple HTTPS listeners on port 443 share SNI-based routing; each scoped to one
# wildcard hostname, so adding a new public domain is just a listener block.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: network
  annotations:
    external-dns.alpha.kubernetes.io/target: 87927ee2-ef79-4dbc-8a1f-dca865b82b79.cfargotunnel.com
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gatus.home-operations.com/endpoint: |
      conditions:
        - "[STATUS] < 500"
        - "[RESPONSE_TIME] < 1000"
      alerts:
        - type: ntfy
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true
          description: "Health check failed"
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: external-proxy-config
  listeners:
    - name: whoverse-nexus
      protocol: HTTPS
      port: 443
      hostname: "*.whoverse.nexus"
      tls:
        mode: Terminate
        certificateRefs:
          - name: whoverse-nexus-wildcard-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: beee-gay
      protocol: HTTPS
      port: 443
      hostname: "*.beee.gay"
      tls:
        mode: Terminate
        certificateRefs:
          - name: beee-gay-wildcard-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: superstar-gay
      protocol: HTTPS
      port: 443
      hostname: "*.superstar.gay"
      tls:
        mode: Terminate
        certificateRefs:
          - name: superstar-gay-wildcard-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
    - name: alinanova-dev
      protocol: HTTPS
      port: 443
      hostname: "*.alinanova.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: alinanova-dev-wildcard-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All
---
# Internal Gateway - accessed via LAN LoadBalancer
# Uses wildcard cert for *.whoverse.dev via DNS-01 challenge (cert-manager)
# HTTPS-only listener; HTTPRoutes bind to all listeners on this Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: network
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gatus.home-operations.com/endpoint: |
      conditions:
        - "[STATUS] < 500"
        - "[RESPONSE_TIME] < 1000"
      alerts:
        - type: ntfy
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true
          description: "Health check failed"
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal-proxy-config
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.whoverse.dev"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: whoverse-dev-wildcard-tls
            kind: Secret
