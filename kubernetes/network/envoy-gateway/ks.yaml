---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: network
spec:
  interval: 30m
  path: "./kubernetes/network/envoy-gateway/app"
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: envoy-gateway
      namespace: network
  timeout: 10m
  wait: true
  prune: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config
  namespace: network
spec:
  dependsOn:
    - name: envoy-gateway
  interval: 10m
  path: "./kubernetes/network/envoy-gateway/config"
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
  timeout: 5m
  wait: true
  prune: true
