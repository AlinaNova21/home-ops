---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whoverse-nexus-wildcard-tls
  namespace: network
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: whoverse-nexus-wildcard-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: whoverse-nexus-cf-origin-cert
        property: file/whoverse-nexus-origin.pem
    - secretKey: tls.key
      remoteRef:
        key: whoverse-nexus-cf-origin-cert
        property: file/whoverse-nexus-origin.key.pem