---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      featureGates: []
    imagePullPolicy: IfNotPresent
  customizeComponents:
    patches:
      - resourceName: virt-api
        resourceType: Deployment
        type: strategic
        patch: |-
          {"spec":{"template":{"spec":{"affinity":{"podAntiAffinity":{"requiredDuringSchedulingIgnoredDuringExecution":[{"labelSelector":{"matchExpressions":[{"key":"kubevirt.io","operator":"In","values":["virt-api"]}]},"topologyKey":"kubernetes.io/hostname"}]}}}}}}
      - resourceName: virt-controller
        resourceType: Deployment
        type: strategic
        patch: |-
          {"spec":{"template":{"spec":{"affinity":{"podAntiAffinity":{"requiredDuringSchedulingIgnoredDuringExecution":[{"labelSelector":{"matchExpressions":[{"key":"kubevirt.io","operator":"In","values":["virt-controller"]}]},"topologyKey":"kubernetes.io/hostname"}]}}}}}}
      - resourceName: virt-exportproxy
        resourceType: Deployment
        type: strategic
        patch: |-
          {"spec":{"template":{"spec":{"affinity":{"podAntiAffinity":{"requiredDuringSchedulingIgnoredDuringExecution":[{"labelSelector":{"matchExpressions":[{"key":"kubevirt.io","operator":"In","values":["virt-exportproxy"]}]},"topologyKey":"kubernetes.io/hostname"}]}}}}}}
      - resourceName: virt-operator
        resourceType: Deployment
        type: strategic
        patch: |-
          {"spec":{"template":{"spec":{"affinity":{"podAntiAffinity":{"requiredDuringSchedulingIgnoredDuringExecution":[{"labelSelector":{"matchExpressions":[{"key":"kubevirt.io","operator":"In","values":["virt-operator"]}]},"topologyKey":"kubernetes.io/hostname"}]}}}}}}
  imagePullPolicy: IfNotPresent
  workloads:
    nodePlacement:
      nodeSelector:
        feature.node.kubernetes.io/cpu-cpuid.VMX: "true"
