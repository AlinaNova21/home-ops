---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-sops
  namespace: flux-system
spec:
  interval: 30m
  path: "./flux-config/sops"
  sourceRef:
    kind: OCIRepository
    name: home-ops
    namespace: flux-system
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: v1
      kind: Secret
      name: onepassword-connect
      namespace: onepassword-connect
  timeout: 5m
  wait: true
