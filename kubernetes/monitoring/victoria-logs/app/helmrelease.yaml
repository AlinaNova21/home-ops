---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
  namespace: monitoring
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: victoria-logs-cluster
    namespace: monitoring
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    vlinsert:
      replicaCount: 2
      resources:
        requests:
          memory: 64Mi

    vlstorage:
      replicaCount: 2
      resources:
        requests:
          memory: 128Mi
      persistentVolume:
        enabled: true
        storageClassName: miroir-replicated
        size: 20Gi
      # Spread storage replicas across different nodes
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: vlstorage
              topologyKey: kubernetes.io/hostname

    vlselect:
      replicaCount: 2
      resources:
        requests:
          memory: 64Mi
