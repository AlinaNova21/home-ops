---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: victoria-metrics-k8s-stack
    namespace: monitoring
  timeout: 10m
  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    # Gives the VMCluster CR a predictable name so the operator creates
    # services named vmselect-victoria-metrics, vminsert-victoria-metrics, etc.
    fullnameOverride: victoria-metrics

    # Disable single-node VM in favour of cluster mode
    vmsingle:
      enabled: false

    vmcluster:
      enabled: true
      spec:
        replicationFactor: 2
        retentionPeriod: "30d"
        vmstorage:
          replicaCount: 3
          storageDataPath: /vm-data
          storage:
            volumeClaimTemplate:
              spec:
                # miroir-replicated (DRBD, 2 replicas across 4-node pool).
                # Replacing openebs-hostpath as part of the miroir migration.
                storageClassName: miroir-replicated
                resources:
                  requests:
                    storage: 25Gi
        vminsert:
          replicaCount: 2
        vmselect:
          replicaCount: 2
          cacheMountPath: /select-cache
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: miroir-replicated
                resources:
                  requests:
                    storage: 2Gi

    # Metrics scraping agent — additional targets via VMServiceScrape/VMPodScrape CRDs
    vmagent:
      enabled: true
      spec:
        selectAllByDefault: true
        scrapeInterval: 30s

    # Bundled exporters — auto-discovered via CRDs with selectAllByDefault
    kube-state-metrics:
      enabled: true

    prometheus-node-exporter:
      enabled: true

    # Kubelet + cadvisor + probes + resources node scrapes (VMNodeScrape).
    # The chart's default relabelConfigs labelmaps *every* node label onto
    # each scraped series. NFD/Talos device-plugin hardware lists
    # (feature.node.kubernetes.io/*, extensions.talos.dev/*, gpu.intel.com/*,
    # intel.feature.node.kubernetes.io/*) push series past vminsert's
    # -maxLabelsPerTimeseries=40, so those series are rejected on ingestion
    # (RowsRejectedOnIngestion + log spam). Drop them after the labelmap.
    kubelet:
      enabled: true
      vmScrape:
        spec:
          relabelConfigs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
            - action: labeldrop
              regex: (feature_node_kubernetes_io_.+|extensions_talos_dev_.+|gpu_intel_com_.+|intel_feature_node_kubernetes_io_.+)
            - sourceLabels: [__metrics_path__]
              targetLabel: metrics_path
            - targetLabel: job
              replacement: kubelet

    # Control-plane component scrapes: kube-controller-manager (:10257) and
    # kube-scheduler (:10259). Talos binds these to 0.0.0.0 (see
    # talos/whoverse/talconfig.yaml) but serves self-signed certs (no
    # --tls-cert-file), so the scrape must skip verification. RBAC for the
    # vmagent SA (/metrics nonResourceURLs) is already chart-generated.
    kubeControllerManager:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - tlsConfig:
                insecureSkipVerify: true
    kubeScheduler:
      enabled: true
      vmScrape:
        spec:
          endpoints:
            - tlsConfig:
                insecureSkipVerify: true

    # Disable bundled Grafana — we deploy our own via grafana-operator.
    # forceDeployDatasource renders the GrafanaDatasource CRs from
    # defaultDatasources despite grafana.enabled=false.
    grafana:
      enabled: false
      forceDeployDatasource: true

    # VictoriaLogs cluster — operator-managed via VLCluster CR (rendered by
    # the chart's sync-job from these values). Replaces the standalone
    # victoria-logs-cluster chart; operator services become
    # vlinsert/vlselect/vlstorage-victoria-metrics.
    # Enabling this also makes the chart emit the VictoriaLogs GrafanaDatasource
    # CR pointing at the new vlselect service.
    vlcluster:
      enabled: true
      spec:
        vlstorage:
          replicaCount: 2
          # Match the old chart's effective retention (k8s-stack default is 14d).
          retentionPeriod: 7d
          storageDataPath: /vl-data
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: miroir-replicated
                resources:
                  requests:
                    storage: 20Gi
          resources:
            requests:
              memory: 128Mi
          # Spread storage replicas across nodes. Selector matches the
          # operator's labels (app.kubernetes.io/name: vlstorage), NOT the old
          # chart's app.kubernetes.io/component label.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: vlstorage
                  topologyKey: kubernetes.io/hostname
        vlselect:
          replicaCount: 2
          resources:
            requests:
              memory: 64Mi
        vlinsert:
          replicaCount: 2
          resources:
            requests:
              memory: 64Mi

    # Enable Alertmanager
    alertmanager:
      enabled: true
      spec:
        externalURL: "https://alerts.whoverse.dev"
      config:
        global:
          resolve_timeout: 5m
        route:
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
            - match_re:
                severity: "error|critical"
              receiver: "chaski"
            - match:
                alertname: Watchdog
              receiver: "null"
        receivers:
          - name: "null"
          - name: "chaski"
            webhook_configs:
              - url: http://chaski.chaski.svc.cluster.local:8080/hooks/alertmanager
                send_resolved: true
        inhibit_rules:
          - source_match:
              severity: critical
            target_match:
              severity: warning
            equal: ["alertname", "namespace"]

    # VMAlert — rule evaluator; picks up PrometheusRule + VMRule CRDs,
    # queries vmselect, writes back to vminsert, notifies bundled alertmanager.
    # All three sinks auto-discovered from the same chart release.
    # HA: 2 replicas with leader election (chart default `replicaCount: 1`
    # would bind the PVC to a single node and stall on node loss).
    vmalert:
      enabled: true
      spec:
        replicaCount: 2
        # Empty matchLabels + matchExpressions = select everything cluster-wide.
        # Mirrors vmagent.spec.selectAllByDefault: true above.
        ruleSelector:
          matchLabels: {}
          matchExpressions: []
        evaluationInterval: 30s
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
        # VMAlert runs as a Deployment (operator v0.73.x) and the VMAlert CRD
        # exposes no `spec.storage` field — only `volumes` + `volumeMounts`
        # for attaching an external PVC. WAL therefore lives on the pod's
        # root filesystem (emptyDir) and alert state resets on restart; rule
        # definitions re-load from PrometheusRule/VMRule CRDs and any active
        # alerts re-fire on the next evaluation cycle.

    defaultDashboards:
      # Emit GrafanaDashboard CRs (grafana-operator) instead of sidecar ConfigMaps.
      # The sync-job creates/updates/prunes them from upstream sources on chart
      # config changes; instanceSelector defaults to dashboards=grafana which
      # matches the Grafana CR in this namespace.
      grafanaOperator:
        enabled: true
    defaultDatasources:
      # Emit GrafanaDatasource CRs (grafana-operator) instead of sidecar CMs.
      grafanaOperator:
        enabled: true
      victoriametrics:
        datasources:
          # Chart default for the main entry, minus the victoriametrics-
          # metrics-datasource variant (its plugin is not installed).
          - name: VictoriaMetrics
            type: prometheus
            access: proxy
            uid: VictoriaMetrics
            isDefault: true
