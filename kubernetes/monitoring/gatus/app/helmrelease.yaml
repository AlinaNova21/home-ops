---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
  namespace: monitoring
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: gatus
    namespace: monitoring
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    serviceAccount:
      gatus:
        enabled: true

    controllers:
      gatus:
        pod:
          automountServiceAccountToken: true
        serviceAccount:
          name: gatus
        containers:
          gatus:
            image:
              repository: ghcr.io/twin/gatus
              tag: v5.36.0@sha256:c5f210d095fa78e6efaa20ffeb14803f2ba4f10615e16a6d12087697149617f0
              pullPolicy: Always
            env:
              TZ:
                value: America/Chicago
              GATUS_CONFIG_PATH:
                value: /config
              NTFY_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: gatus-ntfy
                    key: NTFY_TOKEN
            ports:
              - name: http
                containerPort: 8080
                protocol: TCP
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: http
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: http
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          gatus-sidecar:
            image:
              repository: ghcr.io/home-operations/gatus-sidecar
              tag: 0.5.2@sha256:5fd095a25fa17a6f0f0d4280516d3d5dfd73c878dd5a6ad155c10bff7c1ba94d
              pullPolicy: Always
            args:
              - --auto-httproute
              - --gateway-name=internal
              - --gateway-name=external
              - --log-level=info
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              readOnlyRootFilesystem: true

    service:
      gatus:
        controller: gatus
        ports:
          http:
            port: 80
            targetPort: http
            protocol: TCP

    persistence:
      config:
        type: emptyDir
        sizeLimit: 16Mi
        globalMounts:
          - path: /config
      gatus-config:
        type: configMap
        name: gatus-config
        defaultMode: 0444
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: miroir-replicated
        globalMounts:
          - path: /data
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: gatus