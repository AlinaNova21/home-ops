---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: "grafana"
spec:
  # Pin the same Grafana image as the previous helm chart deployment.
  version: 12.3.1

  # Admin credentials come from the grafana-secrets ExternalSecret via env below;
  # stop the operator from generating its own admin-credentials secret.
  disableDefaultAdminSecret: true

  config:
    server:
      root_url: https://grafana.whoverse.dev
    auth:
      disable_login_form: "true"
    # ${VAR} is expanded by Grafana's env provider at startup; the admin vars are
    # wired from grafana-secrets in spec.deployment below.
    "auth.generic_oauth":
      enabled: "true"
      name: "Kanidm"
      client_id: grafana
      scopes: "openid email profile"
      auto_login: "true"
      auth_url: https://idm.whoverse.nexus/ui/oauth2
      token_url: https://idm.whoverse.nexus/oauth2/token
      api_url: https://idm.whoverse.nexus/oauth2/openid/grafana/userinfo
      use_pkce: "true"
      role_attribute_path: "contains(groups[*], 'admins') && 'Admin' || 'Viewer'"

  # Storage is intentionally ephemeral: everything (dashboards, datasources,
  # folders, plugins, admin creds, OAuth) is declaratively driven by CRs/env,
  # so there is no authoritative state to persist. Avoids the RWO PVC +
  # Recreate dance and keeps the deployment stateless (RollingUpdate).
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secrets
                      key: admin-user
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-secrets
                      key: admin-password
                # Install the VictoriaLogs datasource plugin directly. The VM
                # k8s-stack chart creates the VictoriaLogs GrafanaDatasource CR
                # without plugin info (no version in its default entry), so we
                # install it here rather than via the datasource CR.
                # NOTE: no version pin — Grafana 12.3.1's background installer
                # returns 404 for pinned versions (e.g. :0.30.1) even when the
                # version exists in the catalog; bare name installs latest.
                - name: GF_INSTALL_PLUGINS
                  value: victoriametrics-logs-datasource
