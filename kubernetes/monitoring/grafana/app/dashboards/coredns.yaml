---
# CoreDNS dashboard (grafana.com ID 7249)
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: coredns
  namespace: monitoring
spec:
  folderRef: infrastructure
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  grafanaCom:
    id: 7249
    revision: 1
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics
