---
# Ceph OSD dashboard (grafana.com ID 5336)
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ceph-osd
  namespace: monitoring
spec:
  folderRef: ceph
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  grafanaCom:
    id: 5336
    revision: 9
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics
