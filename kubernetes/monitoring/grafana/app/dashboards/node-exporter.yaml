---
# Node Exporter Full dashboard (grafana.com ID 1860)
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  folderRef: infrastructure
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  grafanaCom:
    id: 1860
    revision: 37
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics
