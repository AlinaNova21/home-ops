---
# Flux CD dashboard (grafana.com ID 16714)
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: flux-cluster
  namespace: monitoring
spec:
  folderRef: flux
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  grafanaCom:
    id: 16714
    revision: 1
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics
