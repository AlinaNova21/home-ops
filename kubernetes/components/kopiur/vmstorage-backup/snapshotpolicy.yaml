  credentialProjection:
    enabled: true
  copyMethod: Direct
  sources:
    - pvc:
        name: vlstorage-volume-victoria-logs-victoria-logs-cluster-vlstorage-1
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 3
