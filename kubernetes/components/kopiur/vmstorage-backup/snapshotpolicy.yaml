# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: vmstorage-0
  namespace: monitoring
spec:
  repository:
    kind: ClusterRepository
    name: whoverse
  credentialProjection:
    enabled: true
  # copyMethod: Direct reads the live PVC without CSI snapshots. Required for
  # openebs-hostpath volumes, which have no VolumeSnapshotClass.
  copyMethod: Direct
  sources:
    - pvc:
        name: vmstorage-db-vmstorage-victoria-metrics-0
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 3
---
