---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/fluxcd.controlplane.io/fluxinstance_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    # renovate: datasource=github-releases depName=controlplaneio-fluxcd/distribution
    version: "2.9.4"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  cluster:
    size: small
  kustomize:
    patches:
      # size:small is the operator-native vertical profile: concurrency 5,
      # requeue-dependency 10s (medium was 10 / 5s). These patches only do
      # what the FluxInstance CRD can't express natively and use the
      # documented `name` regex target — a labelSelector on
      # app.kubernetes.io/name matched no generated Deployment (they carry
      # app.kubernetes.io/component), so the previous patch never applied.
      # Requeue deps at 30s (Flux default) to prevent dependency retry
      # storms, and soft-pin controllers to whoverse-w1 (Intel N150, 16GB)
      # to keep them off the 4-core Celeron etcd hosts.
      - target:
          kind: Deployment
          name: "(kustomize-controller|helm-controller|source-controller)"
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=30s
      - target:
          kind: Deployment
          name: "(kustomize-controller|helm-controller|source-controller)"
        patch: |
          - op: add
            path: /spec/template/spec/affinity
            value:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - whoverse-w1