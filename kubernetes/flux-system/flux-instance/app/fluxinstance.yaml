---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/fluxcd.controlplane.io/fluxinstance_v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    # renovate: datasource=github-releases depName=controlplaneio-fluxcd/distribution
    version: "2.9.4"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  cluster:
    size: medium
  kustomize:
    patches:
      # Controllers run at Flux defaults (concurrency 4, requeue-dependency 30s).
      # The previous --concurrent=16 / --requeue-dependency=5s overloaded the
      # 4-core Celeron control-plane nodes (etcd/API-server timeouts, lost
      # leader leases). Soft-pin the busiest controllers to whoverse-w1
      # (Intel N150, 16GB) to keep them off the etcd hosts.
      - target:
          kind: Deployment
          labelSelector: "app.kubernetes.io/name in (source-controller, kustomize-controller, helm-controller)"
        patch: |
          - op: add
            path: /spec/template/spec/affinity
            value:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - whoverse-w1