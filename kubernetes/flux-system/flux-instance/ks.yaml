---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-instance
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-operator
  interval: 30m
  path: "./flux-system/flux-instance/app"
  sourceRef:
    kind: OCIRepository
    name: home-ops
  wait: true
  prune: true
  timeout: 5m