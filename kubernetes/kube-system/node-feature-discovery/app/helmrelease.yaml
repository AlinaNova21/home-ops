---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: kube-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
    namespace: kube-system
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    master:
      enableTaints: false
      replicaCount: 1
      resources:
        limits:
          memory: 512Mi
    worker:
      enable: true
      resources:
        limits:
          memory: 512Mi
    topologyUpdater:
      enable: false
    gc:
      enable: true
      resources:
        limits:
          memory: 512Mi
