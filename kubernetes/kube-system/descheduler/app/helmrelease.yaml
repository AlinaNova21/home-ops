---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: kube-system
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: descheduler
    namespace: kube-system
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    kind: CronJob
    schedule: "*/5 * * * *"
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    deschedulerPolicy:
      profiles:
        - name: default
          pluginConfig:
            - name: LowNodeUtilization
              args:
                thresholds:
                  memory: 60
                  pods: 60
                targetThresholds:
                  memory: 80
                  pods: 80
          plugins:
            balance:
              enabled:
                - LowNodeUtilization
