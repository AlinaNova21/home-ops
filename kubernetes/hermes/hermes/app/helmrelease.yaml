---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
  namespace: hermes
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: hermes
    namespace: hermes
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    defaultPodOptions:
      runtimeClassName: gvisor
      securityContext:
        # The Hermes image boots PID 1 as root (s6-overlay) so it can chown
        # /run + the data volume, then drops to UID 10000 internally. We must
        # run the POD as root and only drop baseline-forbidden caps that s6
        # doesn't need; gVisor is the sandbox isolating the root PID 1.
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault

    controllers:
      hermes:
        serviceAccount:
          name: hermes
        containers:
          hermes:
            image:
              repository: ghcr.io/alinanova21/hermes-agent
              tag: latest
              pullPolicy: Always
            args: ["gateway", "run"]
            ports:
              - name: http
                containerPort: 9119
            env:
              TZ: "America/Chicago"
              HERMES_CONFIG: "/etc/hermes/config.yaml"
              HERMES_SKIP_CONFIG_MIGRATION: "1"
              HERMES_WRITE_SAFE_ROOT: "/opt/data:/tmp"
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: "0.0.0.0"
              HERMES_DASHBOARD_OIDC_ISSUER: "https://idm.whoverse.nexus/oauth2/openid/hermes"
              HERMES_DASHBOARD_OIDC_CLIENT_ID: "hermes"
              API_SERVER_ENABLED: "false"
              MEMINI_BASE_URL: "http://moltbot-egress.network.svc.cluster.local:8081"
              MEMINI_HOME: "personal/hermes"
              MEMINI_NAMESPACE: "home-ops/hermes"
            envFrom:
              - secretRef:
                  name: hermes-secrets
            securityContext:
              capabilities:
                drop: [NET_RAW, MKNOD]
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
              startup:
                enabled: true

    service:
      hermes:
        controller: hermes
        ports:
          http:
            port: 9119

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: hermes
        globalMounts:
          - path: /opt/data
      config:
        type: configMap
        name: hermes-config
        defaultMode: 0444
        globalMounts:
          - path: /etc/hermes/config.yaml
            subPath: config.yaml
            readOnly: true