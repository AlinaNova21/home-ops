---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: zot
  namespace: storage
spec:
  repository:
    kind: ClusterRepository
    name: whoverse
  copyMethod: Snapshot
  volumeSnapshotClassName: miroir-snap
  staging:
    storageClassName: miroir-local
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
  credentialProjection:
    enabled: true
  sources:
    - pvc:
        name: zot-pvc-zot-0
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 3
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: zot
  namespace: storage
spec:
  policyRef:
    name: zot
  schedule:
    cron: H * * * *
