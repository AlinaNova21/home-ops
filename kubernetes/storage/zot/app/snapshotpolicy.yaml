---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: zot
  namespace: storage
spec:
  repository:
    kind: ClusterRepository
    name: whoverse
  copyMethod: Snapshot
  volumeSnapshotClassName: miroir-snap
  staging:
    storageClassName: miroir-local
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
    # zot's image runs as root (uid 0) and its data is root-owned; pin the
    # mover to uid 0 so it can read the source. Requires namespace storage to
    # be opted into privileged movers:
    #   kubectl annotate namespace storage kopiur.home-operations.com/privileged-movers=true
    securityContext:
      runAsUser: 0
  credentialProjection:
    enabled: true
  sources:
    - pvc:
        name: zot-pvc-zot-0
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 3
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: zot
  namespace: storage
spec:
  policyRef:
    name: zot
  schedule:
    cron: H * * * *
