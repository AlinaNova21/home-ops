    operation: copy
  ref:
    tag: 0.11.15
    digest: sha256:727b1332fcdd4ffe9d283d073ac343d604306c62d7a824839537f2b914cbb5a6
  url: oci://ghcr.io/home-operations/charts/miroir
  verify:
