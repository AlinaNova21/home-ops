---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
  namespace: storage
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: miroir
    namespace: storage
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    drbd:
      resync:
        minRate: 10M
      verify:
        algorithm: crc32c
    autoTieBreaker: true
    replicaCount: 1
    monitoring:
      podMonitor:
        enabled: false
      prometheusRule:
        enabled: false
