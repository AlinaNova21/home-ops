---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
  namespace: storage
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: miroir
    namespace: storage
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    drbd:
      resync:
        minRate: 10M
      verify:
        algorithm: crc32c
    autoTieBreaker: true
    # Convert settled diskless client legs (e.g. after failover) into diskful replicas.
    autoDiskfulAfter: 30m
    replicaCount: 1
    monitoring:
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
