---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
  namespace: storage
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: miroir
    namespace: storage
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    image:
      repository: zot.whoverse.dev/miroir-controller
      tag: 0.11.15-restoretopology
      # Chart-default digest must be cleared: digest wins over tag in the chart helpers.
      digest: ""
    agent:
      image:
        repository: zot.whoverse.dev/miroir-agent
        tag: 0.11.15-restoretopology
        digest: ""
    gateway:
      image:
        repository: zot.whoverse.dev/miroir-gateway
        tag: 0.11.15-restoretopology
        digest: ""
    drbd:
      resync:
        minRate: 10M
      verify:
        algorithm: crc32c
    autoTieBreaker: true
    replicaCount: 1
    monitoring:
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
