---
apiVersion: miroir.home-operations.com/v1alpha1
kind: MiroirNodeGroup
metadata:
  name: cluster
spec:
  nodeSelector:
    matchLabels:
      miroir.home-operations.com/enabled: "true"
  template:
    pools:
      - name: local
        lvmthin:
          device: /dev/disk/by-partlabel/r-miroir
      - name: replicated
        lvmthin:
          device: /dev/disk/by-partlabel/r-miroir
