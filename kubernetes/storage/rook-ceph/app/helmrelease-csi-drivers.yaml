---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ceph-csi-drivers
  namespace: storage
spec:
  interval: 30m
  dependsOn:
    - name: rook-ceph-operator
  chartRef:
    kind: OCIRepository
    name: ceph-csi-drivers
    namespace: storage
  install:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    operatorConfig:
      namespace: storage
      driverSpecDefaults:
        imageSet:
          name: rook-csi-operator-image-set-configmap
        nodePlugin:
          priorityClassName: system-node-critical
        controllerPlugin:
          priorityClassName: system-cluster-critical
        # Enable VolumeSnapshot support for all drivers (required by kopiur)
        # Adds csi-snapshotter sidecar to ctrlplugin pods
        snapshotPolicy: volumeSnapshot
    drivers:
      rbd:
        enabled: true
        name: storage.rbd.csi.ceph.com
        # Required for VolumeSnapshot to work on RBD
        snapshotPolicy: volumeSnapshot
      cephfs:
        enabled: false
      nfs:
        enabled: false
      nvmeof:
        enabled: false
