apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: holmes-data
  namespace: holmes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: miroir-replicated
