---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: holmes
  namespace: holmes
spec:
  interval: 30m
  chart:
    spec:
      chart: holmes
      sourceRef:
        kind: HelmRepository
        name: robusta
        namespace: holmes
      interval: 12h
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    extraEnvVarsSecrets:
      - holmes-secrets
    additionalEnvVars:
      - name: HOLMES_API_KEY
        valueFrom:
          secretKeyRef:
            name: holmes-secrets
            key: HOLMES_API_KEY
    modelList:
      deepseek:
        model: openrouter/deepseek/deepseek-v4-flash
        api_key: envRef:OPENROUTER_API_KEY
        max_tokens: 8192
        temperature: 0.7
    config:
      model: deepseek
    mcpAddons:
      github:
        enabled: true
        auth:
          secretName: holmes-github-mcp-token
          secretKey: token
        config:
          toolsets: repos,pull_requests,issues,context
      kubernetes:
        enabled: true
        serviceAccount:
          create: false
          name: holmes
        config:
          readOnly: true
          disableDestructive: true
    mcp_servers: {}
    additionalVolumes:
      - name: holmes-data
        persistentVolumeClaim:
          claimName: holmes-data
    additionalVolumeMounts:
      - name: holmes-data
        mountPath: /data
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
