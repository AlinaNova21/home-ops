---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: headlamp
    namespace: headlamp
  install:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    config:
      baseURL: ""
      watchPlugins: true
      oidc:
        clientID: "kubernetes"
        issuerURL: "https://idm.whoverse.nexus/oauth2/openid/kubernetes"
        scopes: "openid,profile,email"
        usePKCE: true
    pluginsManager:
      enabled: true
      configContent: |
        plugins:
          - name: flux
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_flux
            version: 0.5.0
          - name: cert-manager
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
            version: 0.1.0
          - name: prometheus
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_prometheus
            version: 0.3.0
          - name: plugin-catalog
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_plugin-catalog
            version: 0.2.0
        installOptions:
          parallel: true
    service:
      port: 4466
    resources:
      requests:
        memory: 96Mi
