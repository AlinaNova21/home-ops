---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox-crds-source
  namespace: agent-sandbox-system
spec:
  interval: 30m
  path: "./kubernetes/agent-sandbox-system/agent-sandbox-crds/app"
  sourceRef:
    kind: GitRepository
    name: home-ops
    namespace: flux-system
  prune: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox-crds
  namespace: agent-sandbox-system
spec:
  dependsOn:
    - name: agent-sandbox-crds-source
  interval: 30m
  path: "./charts/agent-sandbox-controller/crds"
  sourceRef:
    kind: GitRepository
    name: agent-sandbox-crds
  prune: true
