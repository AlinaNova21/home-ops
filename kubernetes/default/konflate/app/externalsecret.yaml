---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate-github-app
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: konflate-github-app
    creationPolicy: Owner
  data:
    - secretKey: appClientId
      remoteRef:
        key: konflate-github-app
        property: appClientId
    - secretKey: KONFLATE_APP_PRIVATE_KEY
      remoteRef:
        key: konflate-github-app
        property: file/whoverse-konflate.2026-07-25.private-key.pem
    - secretKey: KONFLATE_WEBHOOK_SECRET
      remoteRef:
        key: konflate
        property: webhookSecret
    - secretKey: KONFLATE_PUSH_TOKEN
      remoteRef:
        key: konflate
        property: pushToken
