---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: konflate
    namespace: default
  install:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  valuesFrom:
    - kind: Secret
      name: konflate-github-app
      valuesKey: appClientId
      targetPath: config.appClientId
  values:
    replicaCount: 1
    serviceAccount:
      automount: false
    persistence:
      enabled: true
      size: 5Gi
      accessModes:
        - ReadWriteOnce
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
    config:
      repo: github://AlinaNova21/home-ops
      clusterPath: kubernetes
      statusChecks: true
      prComments: true
      publicUrl: https://konflate.whoverse.nexus
      mcp: true
      verifyImages: true
      logLevel: debug
    secret:
      existingSecret: konflate-github-app
