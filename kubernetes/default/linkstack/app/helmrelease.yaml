---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkstack
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: linkstack
    namespace: default
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: "Always"

    controllers:
      linkstack:
        containers:
          app:
            image:
              repository: linkstackorg/linkstack
              tag: latest
              pullPolicy: Always
            ports:
              - name: http
                containerPort: 80
                protocol: TCP
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      linkstack:
        controller: linkstack
        ports:
          http:
            port: 80
            targetPort: http
            protocol: TCP

    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: miroir-replicated
        globalMounts:
          - path: /htdocs
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: linkstack-data
