---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Kanidm OAuth2 client secret for Trilium OIDC (client: trilium, group: trilium_users).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trilium-oauth
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: trilium-oauth
    creationPolicy: Owner
  data:
    - secretKey: TRILIUM_OAUTH_CLIENT_SECRET
      remoteRef:
        key: kanidm-oauth2
        property: trilium-secret