---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yuvomi
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 12h
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    controllers:
      yuvomi:
        containers:
          yuvomi:
            image:
              repository: ghcr.io/ulsklyc/yuvomi
              tag: latest
            env:
              TZ: America/Chicago
              TRUST_PROXY: loopback
              DOCUMENT_STORAGE_LOCAL_ENABLED: "true"
              DOCUMENT_STORAGE_LOCAL_PATH: /data/documents
              BACKUP_DIR: /data/backups
              SESSION_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: yuvomi-secrets
                    key: sessionSecret
              DB_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: yuvomi-secrets
                    key: dbEncryptionKey
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      yuvomi:
        controller: yuvomi
        ports:
          http:
            port: 3000

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: yuvomi
        globalMounts:
          - path: /data
