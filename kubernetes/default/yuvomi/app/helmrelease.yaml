---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: yuvomi
  namespace: default
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: yuvomi
    namespace: default
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    controllers:
      yuvomi:
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          yuvomi:
            image:
              repository: ghcr.io/ulsklyc/yuvomi
              tag: 1.68.0@sha256:679ea03660b269260e01a03b4d379d635bbd3096a2b47bd53a47b42d2fbf671c
            env:
              TZ: America/Chicago
              TRUST_PROXY: "2"
              DOCUMENT_STORAGE_LOCAL_ENABLED: "true"
              DOCUMENT_STORAGE_LOCAL_PATH: /data/documents
              BACKUP_DIR: /data/backups
              DB_PATH: /data/yuvomi.db
              SESSION_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: yuvomi-secrets
                    key: sessionSecret
              DB_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: yuvomi-secrets
                    key: dbEncryptionKey
              GOOGLE_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: yuvomi-secrets
                    key: googleClientId
              GOOGLE_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: yuvomi-secrets
                    key: googleClientSecret
              GOOGLE_REDIRECT_URI: "https://family.whoverse.nexus/api/v1/calendar/google/callback"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      yuvomi:
        controller: yuvomi
        ports:
          http:
            port: 3000

    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: yuvomi
        globalMounts:
          - path: /data
