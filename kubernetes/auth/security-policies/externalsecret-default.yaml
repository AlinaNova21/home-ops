---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# Pulls the Kanidm 'mailpit' OAuth2 client secret into the default namespace
# so SecurityPolicy (which must be co-located with its HTTPRoute) can reference it
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailpit-oidc-client-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mailpit-oidc-client-secret
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: kanidm-oauth2
        property: mailpit-secret
