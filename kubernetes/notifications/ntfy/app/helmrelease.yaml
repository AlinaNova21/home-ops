---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
  namespace: notifications
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: ntfy
    namespace: notifications
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "Always"

    controllers:
      ntfy:
        containers:
          app:
            image:
              repository: binwiederhier/ntfy
              tag: v2.27.0@sha256:f2419f405127afa868f10985c1a41449e673477cee1eb19994339a5ae8b592e7
              pullPolicy: Always
            args:
              - serve
            ports:
              - name: http
                containerPort: 80
                protocol: TCP
            env:
              TZ:
                value: America/Chicago
              NTFY_BASE_URL:
                value: https://ntfy.whoverse.nexus
              NTFY_AUTH_DEFAULT_ACCESS:
                value: deny-all
              NTFY_BEHIND_PROXY:
                value: "true"
              NTFY_ENABLE_LOGIN:
                value: "true"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      ntfy:
        controller: ntfy
        ports:
          http:
            port: 80
            targetPort: http
            protocol: TCP
        labels:
          app.kubernetes.io/name: ntfy

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: miroir-replicated
        globalMounts:
          - path: /etc/ntfy
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: ntfy-config
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: miroir-replicated
        globalMounts:
          - path: /var/lib/ntfy
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: ntfy-data
      cache:
        enabled: true
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /var/cache/ntfy

    serviceMonitor:
      main:
        enabled: true
        endpoints:
          - port: http
            path: /metrics
            interval: 30s
        service:
          identifier: ntfy
