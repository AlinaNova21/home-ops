---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# Snapshot identities match the kopia snapshots taken from dockge:
#   ntfy@notifications:/pvc/ntfy-config
#   ntfy@notifications:/pvc/ntfy-data
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ntfy-config
  namespace: notifications
spec:
  identity:
    username: ntfy
    hostname: notifications
  repository:
    kind: ClusterRepository
    name: whoverse
  copyMethod: Snapshot
  volumeSnapshotClassName: miroir-snap
  staging:
    storageClassName: miroir-local
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
  credentialProjection:
    enabled: true
  sources:
    - pvc:
        name: ntfy-config
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 3
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ntfy-data
  namespace: notifications
spec:
  identity:
    username: ntfy
    hostname: notifications
  repository:
    kind: ClusterRepository
    name: whoverse
  copyMethod: Snapshot
  volumeSnapshotClassName: miroir-snap
  staging:
    storageClassName: miroir-local
  mover:
    inheritSecurityContextFrom:
      pvcConsumer: {}
  credentialProjection:
    enabled: true
  sources:
    - pvc:
        name: ntfy-data
  retention:
    keepDaily: 7
    keepWeekly: 4
    keepMonthly: 3
