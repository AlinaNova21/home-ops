---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: origin-ca-issuer-crds
  namespace: cert-manager
spec:
  interval: 1h
  path: deploy/crds
  sourceRef:
    kind: GitRepository
    name: origin-ca-issuer-upstream
    namespace: cert-manager
  timeout: 5m
  wait: true
  prune: true