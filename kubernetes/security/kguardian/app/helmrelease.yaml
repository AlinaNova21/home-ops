---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kguardian
  namespace: security
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kguardian
    namespace: security
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    # Bundled Postgres on miroir-replicated, 10Gi. No kopiur backup:
    # telemetry is regenerable (broker re-learns from runtime behavior).
    database:
      persistence:
        enabled: true
        size: 10Gi
        storageClassName: miroir-replicated
    # Audit-mode evaluator (would-deny/allow verdicts) — keep on.
    evaluator:
      enabled: true
    # AI assistant (llm-bridge) — off; needs an LLM provider key to enable.
    ai:
      enabled: false
    broker:
      metrics:
        serviceMonitor:
          # vmagent (selectAllByDefault) auto-converts plain ServiceMonitors.
          enabled: true
    frontend:
      ingress:
        # Chart ingress unused — HTTPRoute is the ingress (Task 4).
        enabled: false
