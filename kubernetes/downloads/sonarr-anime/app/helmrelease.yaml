---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr-anime
  namespace: downloads
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: sonarr-anime
    namespace: downloads
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - whoverse-w1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "Always"

    controllers:
      sonarr-anime:
        strategy: Recreate
        containers:
          sonarr-anime:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 4.0.19@sha256:01db3e6a923f6e0f3a217baa94b4660cf2f9b45d4166b2fc8c20c67c5221cb78
            env:
              TZ: "America/Chicago"
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: Enabled
              SONARR__LOG__LEVEL: info
              SONARR__METRICS__ENABLED: "true"
              SONARR__SERVER__PORT: "8989"
              SONARR__UPDATE__BRANCH: main
              SONARR__UPDATE__MECHANISM: External
              SONARR__UPDATE__EXTERNALMESSAGE: "Updates are managed via GitOps"
              SONARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-anime-config
                    key: apikey
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8989
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8989
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      sonarr-anime:
        controller: sonarr-anime
        ports:
          http:
            port: 8989

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: sonarr-anime
        globalMounts:
          - path: /config
      downloads:
        existingClaim: downloads-sabnzbd
        globalMounts:
          - path: /downloads/sabnzbd
      tv-anime:
        existingClaim: media-tv-anime
        globalMounts:
          - path: /data/tv/anime

    serviceMonitor:
      main:
        enabled: true
        endpoints:
          - port: http
            path: /metrics
            interval: 30s
        service:
          identifier: sonarr-anime
