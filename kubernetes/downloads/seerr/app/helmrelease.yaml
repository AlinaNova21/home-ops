---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: downloads
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: seerr
    namespace: downloads
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "Always"

    controllers:
      seerr:
        containers:
          seerr:
            image:
              repository: ghcr.io/seerr-team/seerr
              # renovate: datasource=docker depName=seerr
              tag: latest@sha256:d206d9e4056bb90178297df58047791196e7721e6dc19384579b0530702fe086
            env:
              TZ: "America/Chicago"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: 5055
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: 5055
                  initialDelaySeconds: 5
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi

    service:
      seerr:
        controller: seerr
        ports:
          http:
            port: 5055

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: seerr
        globalMounts:
          - path: /app/config