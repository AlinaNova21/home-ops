---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr-hd
  namespace: downloads
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: sonarr-hd
    namespace: downloads
  install:
    createNamespace: false
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 3
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - whoverse-w1
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "Always"

    controllers:
      sonarr-hd:
        strategy: Recreate
        containers:
          sonarr-hd:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 4.0.19@sha256:67815effd2ea18398ffc2011d974b8b1cd3939eec5aa74688ffbf371ff65dd84
            env:
              TZ: "America/Chicago"
              SONARR__AUTH__METHOD: External
              SONARR__AUTH__REQUIRED: Enabled
              SONARR__LOG__LEVEL: info
              SONARR__SERVER__PORT: "8989"
              SONARR__UPDATE__BRANCH: main
              SONARR__UPDATE__MECHANISM: External
              SONARR__UPDATE__EXTERNALMESSAGE: "Updates are managed via GitOps"
              SONARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-hd-config
                    key: apikey
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8989
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8989
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
          exportarr:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
            args:
              - sonarr
            env:
              PORT: "9707"
              URL: "http://localhost:8989"
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: sonarr-hd-config
                    key: apikey
            ports:
              - name: metrics
                containerPort: 9707
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9707
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9707
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

    service:
      sonarr-hd:
        controller: sonarr-hd
        ports:
          http:
            port: 8989
          metrics:
            port: 9707

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        dataSourceRef:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: sonarr-hd
        globalMounts:
          - path: /config
      downloads:
        existingClaim: downloads-sabnzbd
        globalMounts:
          - path: /downloads/sabnzbd
      tv-hd:
        existingClaim: media-tv-hd
        globalMounts:
          - path: /data/tv/hd
      tv-kids:
        existingClaim: media-tv-kids
        globalMounts:
          - path: /data/tv/kids

    serviceMonitor:
      main:
        enabled: true
        endpoints:
          - port: metrics
            path: /metrics
            interval: 30s
            relabelings:
              - targetLabel: instance
                replacement: sonarr-hd
        service:
          identifier: sonarr-hd
