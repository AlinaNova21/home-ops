name: Validate Kubernetes Manifests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'kubernetes/**'
      - '.github/workflows/validate-kubernetes.yml'
  push:
    branches:
      - 'renovate/**'
    # No path filter: always run so Renovate gets a status check regardless
    # of which files the branch touches. Expensive steps are gated internally.

jobs:
  flate-validate:
    name: Flate Kubernetes Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect kubernetes path changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            kubernetes:
              - 'kubernetes/**'
              - '.github/workflows/validate-kubernetes.yml'

      - name: Run flate test
        if: steps.filter.outputs.kubernetes == 'true'
        uses: home-operations/flate/action@797c483c107913d3f7757b7d3e1f6bc9179fe43d # main
        with:
          command: test all --path ./kubernetes

  # Single gate job that branch protection / Renovate automerge should require.
  # Passes when flate-validate succeeded or was skipped (no k8s changes).
  # Fails only when flate-validate failed or was cancelled.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [flate-validate]
    if: always()
    steps:
      - name: Check result
        run: |
          result="${{ needs.flate-validate.result }}"
          echo "flate-validate: $result"
          if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
            exit 1
          fi
