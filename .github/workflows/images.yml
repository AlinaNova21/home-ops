---
name: Build Images

on:
  push:
    branches: [main]
    paths:
      - "images/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: alinanova21

permissions:
  contents: read
  packages: write

jobs:
  changed-images:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Compute changed image matrix
        id: matrix
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            dirs=$(ls -d images/*/ 2>/dev/null | sed 's|images/||; s|/||')
          else
            dirs=$(git diff --name-only "$before" "${{ github.sha }}" -- images/ \
              | cut -d/ -f2 | sort -u)
          fi
          json='[]'
          for d in $dirs; do
            [ -f "images/$d/Dockerfile" ] || continue
            ver=$(cat "images/$d/VERSION" 2>/dev/null || echo latest)
            json=$(echo "$json" | jq -c --arg n "$d" --arg v "$ver" \
              '. + [{name:$n, version:$v}]')
          done
          {
            echo "matrix<<GH_MATRIX"
            echo "$json"
            echo "GH_MATRIX"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: changed-images
    if: ${{ needs.changed-images.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changed-images.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build args
        id: args
        run: |
          # Optional images/<name>/build-args.env (KEY=VALUE per line) → comma-joined.
          # Plus auto-inject HERMES_VERSION from VERSION (single source for images
          # whose Dockerfile is FROM <upstream>:${HERMES_VERSION}, incl. hermes-agent).
          list=""
          f="images/${{ matrix.name }}/build-args.env"
          [ -f "$f" ] && list="$(paste -sd, "$f")"
          if [ -f "images/${{ matrix.name }}/VERSION" ]; then
            [ -n "$list" ] && list="$list,"
            list="${list}HERMES_VERSION=${{ matrix.version }}"
          fi
          [ -n "$list" ] && echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.version }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.args.outputs.tag }}
            type=raw,value=latest
      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/${{ matrix.name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ steps.args.outputs.list }}
