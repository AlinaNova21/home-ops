name: doc-site

on:
  push:
    branches:
      - main
    paths:
      - 'doc-site/**'
      - 'kubernetes/**'
      - '.github/workflows/doc-site.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-container-registry@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run flate
        uses: home-operations/flate/action@cacd25c7059806e50f988d28f9039df9196786b1 # main
        with:
          command: build all --path ./kubernetes -o json
          output-file: doc-site/public/flate-output.json

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./doc-site
          file: ./doc-site/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/doc-site:latest
            ghcr.io/${{ github.repository }}/doc-site:${{ github.sha }}
