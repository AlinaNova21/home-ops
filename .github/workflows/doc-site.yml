name: doc-site

on:
  push:
    branches:
      - main
    paths:
      - 'doc-site/**'
      - 'kubernetes/**'
      - '.github/workflows/doc-site.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-container-registry@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run flate
        uses: home-operations/flate/action@a0384e04e53209c1ac9fe6a902168e082ea4beff # main
        with:
          command: build all --path ./kubernetes -o json
          output-file: doc-site/public/flate-output.json

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./doc-site
          file: ./doc-site/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/doc-site:latest
            ghcr.io/${{ github.repository }}/doc-site:${{ github.sha }}
